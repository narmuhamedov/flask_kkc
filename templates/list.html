<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Блог</h1>
<ul>
    {% for i in blog %}
    <li>
        <p>{{ i.title }}</p>
        <img src="{{ i.image }}" alt="" width="450" height="250">
        <a href="/blog/{{ i.id }}">Подробнее</a>
    </li>
    {% endfor %}
</ul>
</body>
</html>
